<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>11Pay</title>
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --primary: #4a90e2;
      --primary-dark: #357abd;
      --accent: #ff9500;
      --bg: #f2f4f8;
      --card: #ffffff;
      --text: #333333;
      --gray: #8e8e93;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 70px;
    }
    .container { max-width: 480px; margin: 0 auto; padding: 12px; }
    .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .hidden { display: none !important; }
    .btn {
      width: 100%; border: none; border-radius: 12px; padding: 12px;
      font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e5e5ea; color: #333; }
    .btn-accent { background: var(--accent); color: white; }
    .btn-sm { width: auto; padding: 6px 12px; font-size: 12px; border-radius: 8px; }

    /* 認証画面 */
    .tab-container { display: flex; margin-bottom: 16px; border-bottom: 2px solid #e5e5ea; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: none; font-weight: bold; color: var(--gray); cursor: pointer; }
    .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
    input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; }

    /* ヘッダー・残高 */
    .user-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .user-info { display: flex; align-items: center; gap: 8px; font-weight: bold; }
    .balance-box { text-align: center; background: linear-gradient(135deg, #4a90e2, #50e3c2); color: white; border-radius: 16px; padding: 20px; }
    .balance-val { font-size: 32px; font-weight: bold; margin: 8px 0; }

    /* カメラ */
    #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 200px; }

    /* リスト */
    .list-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 14px; }

    /* モーダル */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; border-radius: 16px; width: 90%; max-width: 400px; padding: 20px; }

    /* 店舗用電卓（反転表示） */
    .calc-screen { font-size: 32px; font-weight: bold; text-align: right; background: #222; color: #00ffcc; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .calc-screen.flip { transform: rotate(180deg); }
    .calc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .calc-btn { padding: 16px; font-size: 20px; font-weight: bold; background: #f0f0f0; border: none; border-radius: 8px; cursor: pointer; }

    /* ボトムナビ */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; z-index: 900; }
    .nav-item { flex: 1; text-align: center; padding: 10px 0; font-size: 11px; color: var(--gray); cursor: pointer; border: none; background: none; }
    .nav-item.active { color: var(--primary); font-weight: bold; }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. ログイン / 新規登録画面 -->
  <div id="auth-view" class="card">
    <div class="tab-container">
      <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">ログイン</button>
      <button id="tab-register" class="tab-btn" onclick="switchTab('register')">新規登録</button>
    </div>

    <div id="form-login">
      <h2 style="text-align:center; margin-bottom:16px;">11Pay ログイン</h2>
      <input type="text" id="login-user" placeholder="ユーザー名">
      <input type="password" id="login-pass" placeholder="パスワード">
      <button class="btn btn-primary" onclick="login()">ログイン</button>
    </div>

    <div id="form-register" class="hidden">
      <h2 style="text-align:center; margin-bottom:16px;">アカウント作成</h2>
      <input type="text" id="reg-user" placeholder="ユーザー名">
      <input type="password" id="reg-pass" placeholder="パスワード">
      <input type="password" id="reg-pass-confirm" placeholder="パスワード(確認)">
      <button class="btn btn-primary" onclick="register()">新規登録</button>
    </div>
  </div>

  <!-- 2. HOME 画面 -->
  <div id="main-view" class="hidden">

    <!-- ユーザーバー -->
    <div class="card user-bar">
      <div class="user-info">👤 <span id="display-user">--</span></div>
      <div>
        <button class="btn btn-secondary btn-sm" onclick="openPassModal()">パスワード変更</button>
        <button class="btn btn-secondary btn-sm" onclick="logout()">ログアウト</button>
      </div>
    </div>

    <!-- 残高カード -->
    <div class="card balance-box">
      <div>残高</div>
      <div class="balance-val">¥<span id="display-balance">0</span></div>
      <div>ポイント: <span id="display-points">0</span> pt</div>
    </div>

    <!-- カメラ機能 -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <strong>QRスキャナー</strong>
        <button id="camera-toggle-btn" class="btn btn-primary btn-sm" onclick="toggleCamera()">カメラON</button>
      </div>
      <div id="reader" class="hidden"></div>
    </div>

    <!-- 歩数 -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span>🚶 今日の歩数: <strong id="display-steps">0</strong> 歩</span>
        <button class="btn btn-accent btn-sm" onclick="addSteps()">1,000歩追加</button>
      </div>
    </div>

    <!-- ニュース -->
    <div class="card">
      <h3>ニュース</h3>
      <div id="news-list" style="margin-top:8px;"></div>
      <button class="btn btn-secondary btn-sm" style="margin-top:8px; width:100%;" onclick="alert('ニュース一覧を開きます')">もっと見る</button>
    </div>

    <!-- 取引履歴 -->
    <div class="card">
      <h3>取引履歴</h3>
      <div id="history-list" style="margin-top:8px;"></div>
      <button class="btn btn-secondary btn-sm" style="margin-top:8px; width:100%;" onclick="alert('全履歴を開きます')">もっと見る</button>
    </div>

  </div>

</div>

<!-- 下部ナビゲーション -->
<div id="bottom-nav" class="bottom-nav hidden">
  <button class="nav-item" onclick="switchNav('coupon')">🎫<br>クーポン</button>
  <button class="nav-item" onclick="switchNav('send')">💸<br>送る</button>
  <button class="nav-item active" onclick="switchNav('home')">🏠<br>ホーム</button>
  <button class="nav-item" onclick="switchNav('game')">🎮<br>ゲーム</button>
  <button class="nav-item" onclick="switchNav('scratch')">🎰<br>スクラッチ</button>
</div>

<!-- モーダル各種 -->

<!-- 店舗電卓モーダル（店員向け反転機能付き） -->
<div id="modal-shop-calc" class="modal hidden">
  <div class="modal-content">
    <div style="text-align:center; font-weight:bold; margin-bottom:8px;" id="calc-shop-title">店舗会計</div>
    <div id="calc-display" class="calc-screen flip">¥0</div>
    <div style="text-align:center; font-size:12px; color:#666; margin-bottom:8px;">※金額は店員側（反対向き）に表示されています</div>
    <div class="calc-grid">
      <button class="calc-btn" onclick="calcInput('7')">7</button>
      <button class="calc-btn" onclick="calcInput('8')">8</button>
      <button class="calc-btn" onclick="calcInput('9')">9</button>
      <button class="calc-btn" onclick="calcInput('4')">4</button>
      <button class="calc-btn" onclick="calcInput('5')">5</button>
      <button class="calc-btn" onclick="calcInput('6')">6</button>
      <button class="calc-btn" onclick="calcInput('1')">1</button>
      <button class="calc-btn" onclick="calcInput('2')">2</button>
      <button class="calc-btn" onclick="calcInput('3')">3</button>
      <button class="calc-btn" onclick="calcClear()">C</button>
      <button class="calc-btn" onclick="calcInput('0')">0</button>
      <button class="calc-btn" onclick="calcInput('00')">00</button>
    </div>
    <button class="btn btn-primary" style="margin-top:12px;" onclick="calcConfirm()">確定してお支払い</button>
    <button class="btn btn-secondary" style="margin-top:6px;" onclick="closeModal('modal-shop-calc')">キャンセル</button>
  </div>
</div>

<!-- お支払い確認モーダル -->
<div id="modal-pay-confirm" class="modal hidden">
  <div class="modal-content">
    <h3>お支払い確認</h3>
    <p style="margin:12px 0;" id="pay-confirm-msg">支払額: ¥0</p>
    <button class="btn btn-primary" onclick="executePay()">支払いを確定する</button>
    <button class="btn btn-secondary" style="margin-top:8px;" onclick="closeModal('modal-pay-confirm')">キャンセル</button>
  </div>
</div>

<!-- 還元ルーレットモーダル -->
<div id="modal-roulette" class="modal hidden">
  <div class="modal-content" style="text-align:center;">
    <h3>🎯 ポイント還元ルーレット</h3>
    <div id="roulette-result" style="font-size:36px; font-weight:bold; color:var(--accent); margin:20px 0;">0%</div>
    <button id="roulette-close-btn" class="btn btn-primary hidden" onclick="closeRoulette()">ポイントを受け取る</button>
  </div>
</div>

<!-- パスワード変更モーダル -->
<div id="modal-pass" class="modal hidden">
  <div class="modal-content">
    <h3>パスワード変更</h3>
    <input type="password" id="old-pass" placeholder="現在のパスワード">
    <input type="password" id="new-pass" placeholder="新しいパスワード">
    <button class="btn btn-primary" onclick="changePassword()">変更する</button>
    <button class="btn btn-secondary" style="margin-top:8px;" onclick="closeModal('modal-pass')">閉じる</button>
  </div>
</div>

<script>
// --- グローバル変数 ---
let currentUser = localStorage.getItem('11pay_user') || "";
let balance = parseInt(localStorage.getItem('11pay_balance')) || 10000;
let points = parseInt(localStorage.getItem('11pay_points')) || 500;
let steps = parseInt(localStorage.getItem('11pay_steps')) || 0;
let historyData = JSON.parse(localStorage.getItem('11pay_history')) || [];
let coupons = JSON.parse(localStorage.getItem('11pay_coupons')) || [];

let scanner = null;
let isCameraActive = false;
let currentPayAmount = 0;
let currentPayShop = "";
let calcVal = "0";

// 初期化
window.onload = () => {
  if (currentUser) {
    showMainView();
  } else {
    showAuthView();
  }
};

// タブ・画面切替
function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
  document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
}

function showAuthView() {
  document.getElementById('auth-view').classList.remove('hidden');
  document.getElementById('main-view').classList.add('hidden');
  document.getElementById('bottom-nav').classList.add('hidden');
}

function showMainView() {
  document.getElementById('auth-view').classList.add('hidden');
  document.getElementById('main-view').classList.remove('hidden');
  document.getElementById('bottom-nav').classList.remove('hidden');
  document.getElementById('display-user').innerText = currentUser;
  updateDisplay();
  renderNews();
}

// 認証
function login() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value.trim();
  if (!u || !p) return alert("入力してください");

  const saved = localStorage.getItem(`user_${u}`);
  if (saved && saved === p) {
    currentUser = u;
    localStorage.setItem('11pay_user', u);
    showMainView();
  } else if (!saved) {
    localStorage.setItem(`user_${u}`, p);
    currentUser = u;
    localStorage.setItem('11pay_user', u);
    showMainView();
  } else {
    alert("パスワードが違います");
  }
}

function register() {
  const u = document.getElementById('reg-user').value.trim();
  const p = document.getElementById('reg-pass').value.trim();
  const pc = document.getElementById('reg-pass-confirm').value.trim();
  if (!u || !p) return alert("入力してください");
  if (p !== pc) return alert("パスワードが一致しません");

  localStorage.setItem(`user_${u}`, p);
  currentUser = u;
  localStorage.setItem('11pay_user', u);
  showMainView();
}

function logout() {
  stopCamera();
  currentUser = "";
  localStorage.removeItem('11pay_user');
  showAuthView();
}

function openPassModal() { document.getElementById('modal-pass').classList.remove('hidden'); }
function changePassword() {
  const oldP = document.getElementById('old-pass').value;
  const newP = document.getElementById('new-pass').value;
  const savedP = localStorage.getItem(`user_${currentUser}`);

  if (oldP === savedP) {
    localStorage.setItem(`user_${currentUser}`, newP);
    alert("パスワードを変更しました");
    closeModal('modal-pass');
  } else {
    alert("現在のパスワードが違います");
  }
}

// 表示更新
function updateDisplay() {
  document.getElementById('display-balance').innerText = balance.toLocaleString();
  document.getElementById('display-points').innerText = points.toLocaleString();
  document.getElementById('display-steps').innerText = steps.toLocaleString();

  localStorage.setItem('11pay_balance', balance);
  localStorage.setItem('11pay_points', points);
  localStorage.setItem('11pay_steps', steps);
  localStorage.setItem('11pay_history', JSON.stringify(historyData));

  renderHistory();
}

function addHistory(title, amount) {
  const date = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  historyData.unshift({ title, amount, date });
  if (historyData.length > 20) historyData.pop();
  updateDisplay();
}

function renderHistory() {
  const el = document.getElementById('history-list');
  if (historyData.length === 0) { el.innerHTML = "<div style='color:#888;'>履歴なし</div>"; return; }
  el.innerHTML = historyData.slice(0, 5).map(h => `
    <div class="list-item">
      <div><b>${h.title}</b><br><small style="color:#888;">${h.date}</small></div>
      <div style="font-weight:bold; color:${h.amount >= 0 ? '#28a745' : '#dc3545'};">
        ${h.amount >= 0 ? '+' : ''}${h.amount.toLocaleString()}
      </div>
    </div>
  `).join('');
}

function renderNews() {
  document.getElementById('news-list').innerHTML = `
    <div class="list-item">📢 11Pay 新機能が追加されました！</div>
    <div class="list-item">🎁 全員に500ptプレゼント中！</div>
  `;
}

// 歩数追加
function addSteps() {
  steps += 1000;
  updateDisplay();
}

// カメラ・QR解析
function toggleCamera() {
  if (isCameraActive) {
    stopCamera();
  } else {
    startCamera();
  }
}

function startCamera() {
  document.getElementById('reader').classList.remove('hidden');
  scanner = new Html5Qrcode("reader");
  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onScanSuccess
  ).then(() => {
    isCameraActive = true;
    document.getElementById('camera-toggle-btn').innerText = "カメラOFF";
  }).catch(() => alert("カメラ起動失敗"));
}

function stopCamera() {
  if (scanner && isCameraActive) {
    scanner.stop().then(() => {
      scanner.clear();
      isCameraActive = false;
      document.getElementById('reader').classList.add('hidden');
      document.getElementById('camera-toggle-btn').innerText = "カメラON";
    }).catch(() => {});
  }
}

// 各種QR読み取り処理
function onScanSuccess(decodedText) {
  stopCamera();

  // 1. お会計（店舗名なし） PAY_1000
  if (decodedText.startsWith("PAY_")) {
    const amt = parseInt(decodedText.replace("PAY_", ""), 10) || 0;
    openPayModal("", amt);
  }
  // 2. お会計（店舗名あり） SHOP_1000_店舗名
  else if (decodedText.startsWith("SHOP_") && decodedText.includes("_", 5)) {
    const parts = decodedText.split("_");
    const amt = parseInt(parts[1], 10) || 0;
    const shop = parts[2] || "";
    openPayModal(shop, amt);
  }
  // 3. 店舗QR（電卓を開く） SHOP_店舗名
  else if (decodedText.startsWith("SHOP_")) {
    const shop = decodedText.replace("SHOP_", "");
    openShopCalc(shop);
  }
  // 4. チャージ CHARGE_1000
  else if (decodedText.startsWith("CHARGE_")) {
    const amt = parseInt(decodedText.replace("CHARGE_", ""), 10) || 0;
    balance += amt;
    addHistory("残高チャージ", amt);
    alert(`¥${amt.toLocaleString()} チャージしました！`);
  }
  // 5. 送る SEND_1000
  else if (decodedText.startsWith("SEND_")) {
    const amt = parseInt(decodedText.replace("SEND_", ""), 10) || 0;
    balance += amt;
    addHistory("送金受領", amt);
    alert(`¥${amt.toLocaleString()} を受け取りました！`);
  }
  // 6. ポイント POINT_500
  else if (decodedText.startsWith("POINT_")) {
    const amt = parseInt(decodedText.replace("POINT_", ""), 10) || 0;
    points += amt;
    addHistory("ポイント獲得", amt);
    alert(`${amt.toLocaleString()} pt 獲得！`);
  }
  // 7. クーポン COUPON:名:割引:条件:期限
  else if (decodedText.startsWith("COUPON:")) {
    const parts = decodedText.split(":");
    const c = { name: parts[1], discount: parts[2], cond: parts[3], expiry: parts[4] };
    coupons.push(c);
    localStorage.setItem('11pay_coupons', JSON.stringify(coupons));
    alert(`クーポン「${c.name}」を獲得しました！`);
  }
  else {
    alert("有効なQRコードではありません: " + decodedText);
  }
}

<!-- 店舗電卓処理 -->
function openShopCalc(shopName) {
  currentPayShop = shopName;
  calcVal = "0";
  document.getElementById('calc-shop-title').innerText = `店舗: ${shopName}`;
  document.getElementById('calc-display').innerText = "¥0";
  document.getElementById('modal-shop-calc').classList.remove('hidden');
}

function calcInput(num) {
  if (calcVal === "0") calcVal = num;
  else calcVal += num;
  document.getElementById('calc-display').innerText = `¥${parseInt(calcVal).toLocaleString()}`;
}

function calcClear() {
  calcVal = "0";
  document.getElementById('calc-display').innerText = "¥0";
}

function calcConfirm() {
  const amt = parseInt(calcVal, 10);
  if (!amt || amt <= 0) return alert("金額を入力してください");
  closeModal('modal-shop-calc');
  openPayModal(currentPayShop, amt);
}

<!-- 支払い＆ルーレット -->
function openPayModal(shop, amt) {
  currentPayShop = shop;
  currentPayAmount = amt;
  const shopLabel = shop ? `[${shop}] ` : "";
  document.getElementById('pay-confirm-msg').innerText = `${shopLabel}お支払い額: ¥${amt.toLocaleString()}`;
  document.getElementById('modal-pay-confirm').classList.remove('hidden');
}

function executePay() {
  if (balance < currentPayAmount) return alert("残高が不足しています");
  balance -= currentPayAmount;
  const label = currentPayShop ? `${currentPayShop}でお支払い` : "お支払い";
  addHistory(label, -currentPayAmount);
  closeModal('modal-pay-confirm');

  startRoulette(currentPayAmount);
}

function startRoulette(payAmt) {
  document.getElementById('modal-roulette').classList.remove('hidden');
  document.getElementById('roulette-close-btn').classList.add('hidden');

  let count = 0;
  const rates = [0.01, 0.05, 0.1, 0.5, 1.0];
  const interval = setInterval(() => {
    const r = rates[Math.floor(Math.random() * rates.length)];
    document.getElementById('roulette-result').innerText = `${Math.round(r * 100)}% 還元`;
    count++;
    if (count > 15) {
      clearInterval(interval);
      const finalRate = rates[Math.floor(Math.random() * rates.length)];
      const getPt = Math.max(1, Math.floor(payAmt * finalRate));
      points += getPt;
      addHistory("ルーレット還元", getPt);
      document.getElementById('roulette-result').innerText = `🎉 ${Math.round(finalRate * 100)}% 還元!\n(+${getPt}pt)`;
      document.getElementById('roulette-close-btn').classList.remove('hidden');
    }
  }, 100);
}

function closeRoulette() {
  closeModal('modal-roulette');
  updateDisplay();
}

function switchNav(nav) {
  alert(`「${nav}」メニューを開きます`);
}

function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}
</script>
</body>
</html>
